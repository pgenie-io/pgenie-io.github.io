<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title>pGenie social preview</title>
  <desc>SQL migrations and queries in, a type-safe PostgreSQL client SDK out.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b0f" />
      <stop offset="100%" stop-color="#101725" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="20%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#d4a547" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#d4a547" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#d4a547" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="85%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#5b8af5" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#5b8af5" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#5b8af5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a547" />
      <stop offset="45%" stop-color="#e8a87c" />
      <stop offset="100%" stop-color="#8db7ff" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6577" />
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="40" y="40" width="1120" height="550" rx="30" fill="#0e1117" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.08" />
  <circle cx="160" cy="100" r="220" fill="url(#goldGlow)" />
  <circle cx="1060" cy="560" r="260" fill="url(#blueGlow)" />

  <!-- brand -->
  <text x="86" y="118" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">pGenie</text>
  <text x="286" y="118" fill="#8b95a1" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">SQL-first code generator for PostgreSQL</text>

  <!-- pipeline -->
  <g font-family="Arial, Helvetica, sans-serif">

    <!-- step 1: migrations -->
    <g transform="translate(86 190)">
      <rect width="270" height="200" rx="20" fill="#141920" stroke="#5b8af5" stroke-opacity="0.30" />
      <circle cx="34" cy="34" r="16" fill="#141920" stroke="#5b8af5" stroke-opacity="0.5" />
      <text x="34" y="40" fill="#9fc0ff" font-size="16" font-weight="800" text-anchor="middle">1</text>
      <text x="60" y="40" fill="#e8edf2" font-size="20" font-weight="700">migrations/</text>
      <rect x="26" y="70" width="218" height="106" rx="10" fill="#0c1118" stroke="#ffffff" stroke-opacity="0.06" />
      <text x="42" y="96" font-size="14" fill="#6b93d1" font-weight="700">CREATE TABLE</text>
      <text x="42" y="118" font-size="14" fill="#8b95a1">  id uuid primary key,</text>
      <text x="42" y="140" font-size="14" fill="#8b95a1">  email text unique,</text>
      <text x="42" y="162" font-size="14" fill="#8b95a1">  created_at timestamptz</text>
    </g>

    <path d="M366 290 L 424 290" stroke="#5b6577" stroke-width="3" marker-end="url(#arrow)" />

    <!-- step 2: queries -->
    <g transform="translate(434 190)">
      <rect width="270" height="200" rx="20" fill="#141920" stroke="#5b8af5" stroke-opacity="0.30" />
      <circle cx="34" cy="34" r="16" fill="#141920" stroke="#5b8af5" stroke-opacity="0.5" />
      <text x="34" y="40" fill="#9fc0ff" font-size="16" font-weight="800" text-anchor="middle">2</text>
      <text x="60" y="40" fill="#e8edf2" font-size="20" font-weight="700">queries/</text>
      <rect x="26" y="70" width="218" height="106" rx="10" fill="#0c1118" stroke="#ffffff" stroke-opacity="0.06" />
      <text x="42" y="96" font-size="14" fill="#6b93d1" font-weight="700">SELECT id, email</text>
      <text x="42" y="118" font-size="14" fill="#8b95a1">FROM users</text>
      <text x="42" y="140" font-size="14" fill="#8b95a1">WHERE created_at</text>
      <text x="42" y="162" font-size="14" fill="#8b95a1">  &gt; $1</text>
    </g>

    <path d="M714 290 L 772 290" stroke="#5b6577" stroke-width="3" marker-end="url(#arrow)" />

    <!-- step 3: generated SDK -->
    <g transform="translate(782 190)">
      <rect width="332" height="200" rx="20" fill="#131f18" stroke="#34d399" stroke-opacity="0.35" />
      <circle cx="34" cy="34" r="16" fill="#131f18" stroke="#34d399" stroke-opacity="0.55" />
      <text x="34" y="40" fill="#7ce5bb" font-size="16" font-weight="800" text-anchor="middle">3</text>
      <text x="60" y="40" fill="#e8edf2" font-size="20" font-weight="700">Typed SDK</text>
      <rect x="26" y="70" width="280" height="106" rx="10" fill="#0c1118" stroke="#ffffff" stroke-opacity="0.06" />
      <text x="42" y="96" font-size="14" fill="#f0c86b" font-weight="700">findUsersSince(</text>
      <text x="42" y="118" font-size="14" fill="#8b95a1">  since: Date</text>
      <text x="42" y="140" font-size="14" fill="#f0c86b" font-weight="700">): Promise&lt;</text>
      <text x="42" y="162" font-size="14" fill="#7ce5bb">  { id: string; email: string }[]&gt;</text>
    </g>
  </g>

  <!-- command bar -->
  <g transform="translate(86 434)">
    <rect width="1028" height="60" rx="30" fill="#131a23" stroke="#d4a547" stroke-opacity="0.30" />
    <circle cx="30" cy="30" r="6" fill="#d4a547" />
    <text x="52" y="37" fill="#f0c86b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">$ pgn generate</text>
    <text x="300" y="37" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">one command, no hand-written boilerplate</text>
  </g>

  <text x="86" y="548" fill="#8b95a1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Deterministic. Reproducible. Correct-by-construction.</text>
</svg>
